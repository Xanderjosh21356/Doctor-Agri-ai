name: Build Updated Signed Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Validate Signing Secrets
        run: |
          echo "Validating required GitHub repository secrets..."
          MISSING_SECRETS=0
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing"
            MISSING_SECRETS=1
          fi
          if [ -z "${ANDROID_KEYSTORE_PASSWORD}" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_PASSWORD is missing"
            MISSING_SECRETS=1
          fi
          if [ -z "${ANDROID_KEY_ALIAS}" ]; then
            echo "::error::Secret ANDROID_KEY_ALIAS is missing"
            MISSING_SECRETS=1
          fi
          if [ -z "${ANDROID_KEY_PASSWORD}" ]; then
            echo "::error::Secret ANDROID_KEY_PASSWORD is missing"
            MISSING_SECRETS=1
          fi

          if [ $MISSING_SECRETS -ne 0 ]; then
            echo "::error::One or more required signing secrets are missing. Workflow cannot proceed."
            exit 1
          fi
          echo "All required signing secrets are present."
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Restore and Verify Existing Keystore
        run: |
          echo "Recreating keystore from Base64 secret..."
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks

          if [ ! -s "upload-keystore.jks" ]; then
            echo "::error::Keystore file upload-keystore.jks was not restored or is empty."
            exit 1
          fi

          echo "Verifying restored keystore can be opened with password..."
          if ! keytool -list -keystore upload-keystore.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" > /dev/null 2>&1; then
            echo "::error::Keystore verification failed. Password invalid or keystore corrupted."
            exit 1
          fi

          echo "Verifying key alias exists in keystore..."
          if ! keytool -list -keystore upload-keystore.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::Key alias does not exist in the restored keystore."
            exit 1
          fi

          KEYSTORE_ABS_PATH="$(pwd)/upload-keystore.jks"
          echo "ANDROID_KEYSTORE_PATH=${KEYSTORE_ABS_PATH}" >> $GITHUB_ENV
          echo "Keystore successfully restored and verified at: ${KEYSTORE_ABS_PATH}"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Locate Release APK
        run: |
          APK_FILE=$(find app/build/outputs/apk/release -type f -name "*.apk" ! -name "*unsigned*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          fi

          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "::error::Release APK could not be found in app/build/outputs/apk/release"
            exit 1
          fi

          echo "Found release APK: $APK_FILE"
          echo "APK_PATH=$APK_FILE" >> $GITHUB_ENV
          echo "APK_NAME=$(basename $APK_FILE)" >> $GITHUB_ENV

      - name: Verify APK Cryptographic Signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::Android apksigner tool not found in $ANDROID_HOME/build-tools"
            exit 1
          fi

          echo "Using apksigner at: $APKSIGNER"
          echo "Verifying cryptographic signature on: ${{ env.APK_PATH }}"

          if ! "$APKSIGNER" verify --verbose "${{ env.APK_PATH }}"; then
            echo "::error::APK signature verification failed!"
            exit 1
          fi

          echo "APK is cryptographically signed and passed all verification checks!"

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Updated-Signed-Release-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1-build.${{ github.run_number }}
          name: Signed Release APK v1.1
          body: |
            ## Agri-Doctor AI Release v1.1
            - **Version Code**: 2
            - **Version Name**: 1.1
            - **Build Run**: #${{ github.run_number }}
            - **Signature**: Verified cryptographically with Android `apksigner`
            - **Package**: `com.aistudio.agridoctor.rwnda`
          files: ${{ env.APK_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up Restored Keystore
        if: always()
        run: |
          rm -f upload-keystore.jks
